name: Build math flick IME
on:
  push:
    branches:
      - 'codex/math-flick-*'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile, test, package and sign APK
        run: bash math-logic-ime/ci/build.sh
      - name: Enable Android emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Android IME input smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: python3 math-logic-ime/ci/ui_smoke.py
      - name: Upload APK and test screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: math-flick-android
          path: |
            math-logic-ime/build/math-flick.apk
            math-logic-ime/build/ui/
          retention-days: 30
